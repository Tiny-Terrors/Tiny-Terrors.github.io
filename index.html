<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Rockband</title>

  <style>
@font-face {
  font-family: 'Grooved';
  src: url('GroovedPersonalUseRegular-9Y350.ttf') format('truetype');
}
@import url('https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Montserrat:wght@300;400&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;

}

body{

  background:
  linear-gradient(
    rgba(7,5,4,0.68),
    rgba(7,5,4,0.86)
  ),
  url('Cover1a.png') center/cover fixed;

background-color:#120d0a;

  background-color:#120d0a;

  color:#e7d8c7;

  font-family:'Montserrat',sans-serif;

  font-weight:300;

  line-height:1.8;

  letter-spacing:0.3px;
}

/* ATMOSPHERIC OVERLAY */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,
    rgba(255,180,120,0.05),
    transparent 40%),

    radial-gradient(circle at bottom right,
    rgba(255,140,80,0.03),
    transparent 40%);

  pointer-events:none;

  z-index:-1;
}

/* NAVIGATION */

nav{

  position:fixed;

  width:100%;

  top:0;

  padding:30px 60px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  z-index:1000;

  background:rgba(10,8,7,0.28);

  backdrop-filter:blur(5px);
}

nav a{

  font-family:'Cormorant Garamond',serif;

  color:#b79b81;

  text-decoration:none;

  margin-right:35px;

  font-size:1rem;

  font-weight:600;

  letter-spacing:2px;

  text-transform:uppercase;

  transition:0.3s;
}

nav a:hover{

  color:#f0d5b5;
}

/* HEADER */

header{

  height:100vh;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:40px;
}

/* MAIN TITLE */

h1 {
  font-family: 'Grooved', sans-serif;
  font-size: clamp(4.8rem, 11vw, 8.5rem);
  line-height: 0.78;
  letter-spacing: -2px;
  text-transform: uppercase;
  color: #f4f4f4;
  text-align: center;
  margin: 0 0 15px 0;
  font-weight: normal;
  transform: scaleX(1.08);
  text-shadow:
  0 0 4px rgba(255,255,255,.35),
  0 0 18px rgba(100,180,230,.25);
}

/* SUBTITLE UNDER LOGO */

header p{

  font-family:'Cormorant Garamond',serif;

  font-size:1.35rem;

  font-weight:500;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#b89b7f;

  margin-bottom:45px;
}

/* BUTTON */

.button{

  border:1px solid #7e6148;

  padding:16px 42px;

  text-decoration:none;

  color:#d6b08b;

  font-family:'Cormorant Garamond',serif;

  font-size:1rem;

  font-weight:600;

  letter-spacing:2px;

  text-transform:uppercase;

  transition:0.4s;
}

.button:hover{

  background:#cda47d;

  color:black;
}

/* CONTENT */

section{

  max-width:1100px;

  margin:auto;

  padding:140px 40px;

  border-top:
    1px solid rgba(255,255,255,0.05);
}

/* SECTION TITLES */

h2{

  font-family:'Cormorant Garamond',serif;

  font-size:3.4rem;

  font-weight:600;

  letter-spacing:2px;

  text-transform:uppercase;

  color:#cfac86;

  margin-bottom:35px;

  text-shadow:
    0 0 6px rgba(0,0,0,0.8);
}

/* TEXT */

p{

  max-width:700px;

  color:#d0c1b3;

  font-size:1rem;
}

/* TOUR DATES */

.tour-item{

  display:flex;

  justify-content:space-between;

  padding:22px 0;

  border-bottom:
    1px solid rgba(255,255,255,0.05);

  color:#bfa792;

  font-size:1rem;

  letter-spacing:0.8px;
}

/* BAND IMAGE */

.band-image{

  width:100%;

  margin-top:60px;

  filter:
    brightness(72%)
    contrast(108%);

  border:
    1px solid rgba(255,255,255,0.05);
}

/* FOOTER */

footer{

  text-align:center;

  padding:80px 20px;

  color:#7d6856;

  font-family:'Cormorant Garamond',serif;

  font-size:1rem;

  letter-spacing:2px;
}

/* MOBILE */

@media(max-width:768px){

  nav{
    padding:20px;
  }

  nav a{

    margin-right:15px;

    font-size:0.85rem;
  }

  h1{

    font-size:4.8rem;

    letter-spacing:2px;
  }

  h2{

    font-size:2.3rem;
  }

  header p{

    font-size:1.05rem;
  }

  section{

    padding:100px 25px;
  }

  .tour-item{

    flex-direction:column;

    gap:5px;
  }
}
.logo{
  width:min(700px,85vw);
  max-height:320px;
  object-fit:contain;
  display:block;
  margin:auto;
  filter:
    drop-shadow(0 0 12px rgba(160,210,255,.20))
    drop-shadow(0 0 28px rgba(120,180,220,.20));
}

    .logo-area{
  position:relative;
  width:min(900px,92vw);
  min-height:340px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto;
}

    .glass-bg{
  position:absolute;

  width:auto;
  height:170%;

  opacity:.36;

  z-index:1;

  pointer-events:none;

  left:50%;
  top:50%;

  transform:
    translate(-56%, -50%);

  filter:
    brightness(1.18)
    contrast(1.18)
    drop-shadow(0 0 20px rgba(120,190,230,.32));
}

.logo-text{
  position:relative;
  z-index:2;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <div class="logo-area">

  <img class="glass-bg" src="glasscherben_freigestellt.png" alt="">

  <div class="logo-text">
    <h1>TINY<br>TERRORS</h1>
    <p>Hardrock | Heavy Metal | Coverband</p>
  </div>

</div>
  
  <a class="button" href="#kontakt">
    Booking anfragen
  </a>
</header>

<section>
  <h2>Über uns</h2>
  <p>
    Wir spielen Rock-Klassiker und moderne Coversongs live.
  </p>
</section>

<section>
  <h2>Konzerttermine</h2>

  <p>12.06.2026 — München</p>
  <p>28.06.2026 — Augsburg</p>
</section>

<section id="kontakt">
  <h2>Kontakt</h2>

  <p>booking@meineband.de</p>
</section>

</body>
</html>
