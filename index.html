<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Rockband</title>

  <style>
   <style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap');

body {
  margin: 0;
  background-color: #1a1410;
  color: #f2e6d8;
  font-family: 'Montserrat', sans-serif;
  line-height: 1.7;
}

header {
  height: 100vh;
  background:
    linear-gradient(rgba(20,15,10,0.6), rgba(20,15,10,0.8)),
    url('band.jpg') center/cover;
    
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-family: 'Cinzel', serif;
  font-size: 5rem;
  letter-spacing: 8px;
  margin-bottom: 10px;
  color: #d6b38a;
}

header p {
  font-size: 1.3rem;
  color: #c8b29a;
}

section {
  max-width: 900px;
  margin: auto;
  padding: 100px 30px;
}

h2 {
  font-family: 'Cinzel', serif;
  font-size: 2.2rem;
  color: #d6b38a;
  margin-bottom: 30px;
  letter-spacing: 2px;
}

.button {
  display: inline-block;
  margin-top: 30px;
  padding: 14px 34px;
  border: 1px solid #b08b62;
  color: #f2e6d8;
  text-decoration: none;
  transition: 0.3s;
  letter-spacing: 2px;
}

.button:hover {
  background: #b08b62;
  color: black;
}

p {
  color: #d8c8b8;
}

</style>
  </style>
</head>

<body>

<header>
  <h1>MEINE ROCKBAND</h1>
  <p>Rock Cover • Live • Energie</p>

  <a class="button" href="#kontakt">
    Booking anfragen
  </a>
</header>

<section>
  <h2>Über uns</h2>
  <p>
    Wir spielen Rock-Klassiker und moderne Coversongs live.
  </p>
</section>

<section>
  <h2>Konzerttermine</h2>

  <p>12.06.2026 — München</p>
  <p>28.06.2026 — Augsburg</p>
</section>

<section id="kontakt">
  <h2>Kontakt</h2>

  <p>booking@meineband.de</p>
</section>

</body>
</html>
